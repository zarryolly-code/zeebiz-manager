<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer | ZeeBiz Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 8%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #111827;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button,
        .cancel {
            padding: 13px 20px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        button {
            border: none;
            background: #111827;
            color: white;
        }

        .cancel {
            background: #f3f4f6;
            color: #111827;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">ZeeBiz Manager</div>
    </header>

    <main class="container">

        <div class="form-card">

            <h1>Add Customer 👥</h1>

            <p class="subtitle">
                Enter the customer's information below.
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label for="name">Customer Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter customer name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input
                        type="text"
                        id="address"
                        name="address"
                        placeholder="Enter customer address"
                    >
                </div>

                <div class="buttons">
                    <button type="submit">
                        Save Customer
                    </button>

                    <a href="/accounts/customers/" class="cancel">
                        Cancel
                    </a>
                </div>

            </form>

        </div>

    </main>

</body>
</html>
