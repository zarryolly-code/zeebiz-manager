<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Business Account | ZeeBiz Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00B4DB, #6A5CFF, #FF4ECD);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .register-card {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
        }

        h1 {
            text-align: center;
            color: #6A5CFF;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #6A5CFF;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #00B4DB, #6A5CFF, #FF4ECD);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #6A5CFF;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .register-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="register-card">

    <h1>🚀 Create Your ZeeBiz Account</h1>

    <p class="subtitle">
        Manage your business with ZeeBiz Manager.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label for="business_name">Business Name</label>
            <input
                type="text"
                id="business_name"
                name="business_name"
                required
            >
        </div>

        <div class="form-group">
            <label for="owner_name">Owner Name</label>
            <input
                type="text"
                id="owner_name"
                name="owner_name"
                required
            >
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="address">Business Address</label>
            <input
                type="text"
                id="address"
                name="address"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
            >
        </div>

        <button type="submit">
            Create Business Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="{% url 'business_login' %}">
            Login
        </a>
    </div>

</div>

</body>
</html>
