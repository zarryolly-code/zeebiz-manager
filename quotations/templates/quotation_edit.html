<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Quotation | ZeeBiz Manager</title>

<style>
    :root {
        --primary: {{ business.primary_color|default:"#1F4E79" }};
        --secondary: {{ business.secondary_color|default:"#F59E0B" }};
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #1f2937;
    }

    .container {
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .card {
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,.08);
        border-top: 4px solid var(--primary);
    }

    h1 {
        color: var(--primary);
        margin-bottom: 8px;
    }

    .subtitle {
        color: #64748b;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: var(--primary);
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 30px;
    }

    button,
    .back {
        padding: 13px 20px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
        font-size: 15px;
    }

    button {
        background: var(--primary);
        color: white;
        flex: 1;
    }

    button:hover {
        opacity: .9;
    }

    .back {
        background: #e5e7eb;
        color: #1f2937;
    }

    .back:hover {
        border: 1px solid var(--secondary);
    }

    @media (max-width: 600px) {
        .card {
            padding: 25px 20px;
        }

        .buttons {
            flex-direction: column;
        }

        button,
        .back {
            width: 100%;
            text-align: center;
        }
    }
</style>

</head>

<body>

<div class="container">

<div class="card">

    <h1>✏️ Edit Quotation</h1>

    <p class="subtitle">
        Update the quotation information below.
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="customer">
                Customer
            </label>

            <select
                id="customer"
                name="customer"
                required
            >

                {% for customer in customers %}

                    <option
                        value="{{ customer.id }}"
                        {% if customer.id == quotation.customer.id %}
                            selected
                        {% endif %}
                    >
                        {{ customer.name }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label for="quotation_number">
                Quotation Number
            </label>

            <input
                type="text"
                id="quotation_number"
                name="quotation_number"
                value="{{ quotation.quotation_number }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="valid_until">
                Valid Until
            </label>

            <input
                type="date"
                id="valid_until"
                name="valid_until"
                value="{{ quotation.valid_until|date:'Y-m-d' }}"
            >

        </div>


        <div class="form-group">

            <label for="discount">
                Discount (₦)
            </label>

            <input
                type="number"
                id="discount"
                name="discount"
                value="{{ quotation.discount }}"
                min="0"
                step="0.01"
            >

        </div>


        <div class="form-group">

            <label for="notes">
                Notes
            </label>

            <textarea
                id="notes"
                name="notes"
            >{{ quotation.notes }}</textarea>

        </div>


        <div class="buttons">

            <a
                href="{% url 'quotation_detail' quotation.id %}"
                class="back"
            >
                ← Cancel
            </a>

            <button type="submit">
                💾 Save Changes
            </button>

        </div>

    </form>

</div>


</div>

</body>

</html>
