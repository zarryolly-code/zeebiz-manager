<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Receipt | ZeeBiz Manager</title>

    <style>

        :root {
            --primary: {{ business.primary_color|default:"#1F4E79" }};
            --secondary: {{ business.secondary_color|default:"#F59E0B" }};
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            min-height: 70vh;
            margin: 80px auto;
            padding: 20px;
            display: flex;
            align-items: center;
        }

        .card {
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            color: #dc2626;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .receipt-number {
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .warning {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
        }

        .buttons form {
            margin: 0;
            display: flex;
        }

        button,
        a {
            padding: 13px 22px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .delete-button {
            background: #dc2626;
            color: white;
        }

        .cancel-button {
            background: #e5e7eb;
            color: #1f2937;
        }

        .delete-button:hover {
            background: #b91c1c;
        }

        .cancel-button:hover {
            background: #d1d5db;
        }

        .site-footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 30px;
            background: #1f2937;
            color: white;
            font-size: 14px;
        }

        .site-footer p {
            color: white;
            margin: 0;
        }

        @media (max-width: 600px) {

            .container {
                width: 100%;
                min-height: 65vh;
                margin: 40px auto;
                padding: 15px;
            }

            .card {
                padding: 30px 20px;
                border-radius: 12px;
            }

            .icon {
                font-size: 48px;
                margin-bottom: 15px;
            }

            h1 {
                font-size: 28px;
            }

            .buttons {
                flex-direction: column;
                gap: 10px;
            }

            .buttons form {
                width: 100%;
            }

            button,
            a {
                width: 100%;
                min-height: 48px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .site-footer {
                margin-top: 20px;
                padding: 25px 15px;
                font-size: 13px;
            }
        }

        @media (max-width: 380px) {

            .container {
                padding: 10px;
            }

            .card {
                padding: 25px 15px;
            }

            h1 {
                font-size: 25px;
            }

            .icon {
                font-size: 44px;
            }

            .warning {
                padding: 13px;
                font-size: 14px;
            }

            button,
            a {
                font-size: 14px;
            }
        }

    </style>

</head>

<body>


<div class="container">

    <div class="card">

        <div class="icon">
            ⚠️
        </div>


        <h1>
            Delete Receipt?
        </h1>


        <p>
            Are you sure you want to delete this payment receipt?
        </p>


        <div class="receipt-number">
            {{ receipt.receipt_number }}
        </div>


        <div class="warning">
            This action cannot be undone.
        </div>


        <div class="buttons">

            <a
                href="{% url 'receipt_detail' receipt.id %}"
                class="cancel-button"
            >
                ← Cancel
            </a>


            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="delete-button"
                >
                    🗑️ Yes, Delete
                </button>

            </form>

        </div>

    </div>

</div>


<footer class="site-footer">

    <p>
        © 2026 ZeeBiz Manager. All rights reserved.
    </p>

</footer>


</body>

</html>
