<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Plan | ZeeBiz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            overflow-x: hidden;
        }

        .card {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .plan {
            font-size: 28px;
            font-weight: bold;
            margin: 25px 0;
            color: #16a34a;
            overflow-wrap: anywhere;
        }

        .card p {
            line-height: 1.6;
        }

        .price {
            font-size: 26px;
            font-weight: bold;
            color: #1f2937;
            margin: 20px 0;
            overflow-wrap: anywhere;
        }

        .pay-btn {
            display: inline-block;
            background: #16a34a;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 5px;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

        .site-footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
            background: #1f2937;
            color: white;
            font-size: 14px;
            margin-left: -20px;
            margin-right: -20px;
            margin-bottom: -40px;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }

            .card {
                width: 100%;
                margin: 25px auto;
                padding: 28px 18px;
                border-radius: 14px;
            }

            h1 {
                font-size: 27px;
            }

            .plan {
                font-size: 25px;
                margin: 20px 0;
            }

            .price {
                font-size: 24px;
            }

            .pay-btn {
                width: 100%;
                display: block;
                padding: 14px 10px;
            }

            .back {
                padding: 12px;
            }

            .site-footer {
                margin-top: 40px;
                margin-left: -15px;
                margin-right: -15px;
                margin-bottom: -25px;
                padding: 25px 15px;
                font-size: 13px;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 20px 10px;
            }

            .card {
                padding: 24px 15px;
            }

            h1 {
                font-size: 24px;
            }

            .plan {
                font-size: 23px;
            }

            .price {
                font-size: 22px;
            }

            .site-footer {
                margin-left: -10px;
                margin-right: -10px;
                margin-bottom: -20px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>You're choosing:</h1>

        <div class="plan">
            {{ plan_name }}
        </div>

        <p>
            You've selected this ZeeBiz subscription plan.
        </p>

        <p class="price">
            ₦{{ price|floatformat:0 }}
        </p>

        <p>
            Continue to Paystack to complete your payment.
        </p>

        <a href="{% url 'paystack_payment' plan_name %}" class="pay-btn">
            Continue to Payment
        </a>

        <a href="{% url 'plans' %}" class="back">
            ← Back to Plans
        </a>

    </div>

    <footer class="site-footer">
        <p>© 2026 ZeeBiz Manager. All rights reserved.</p>
    </footer>

</body>
</html>
