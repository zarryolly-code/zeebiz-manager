<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Plan | ZeeBiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .card {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #4f46e5;
        }

        .plan {
            font-size: 28px;
            font-weight: bold;
            margin: 25px 0;
            color: #16a34a;
        }

        .pay-btn {
            display: inline-block;
            background: #16a34a;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #4f46e5;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>You're choosing:</h1>

        <div class="plan">
            {{ plan_name }}
        </div>

        <p>
            You've selected this ZeeBiz subscription plan.
        </p>

        <p class="price">
            ₦{{ price|floatformat:0 }}
        </p>

        <p>
            Continue to Paystack to complete your payment.
        </p>

        <a href="{% url 'paystack_payment' plan_name %}" class="pay-btn">
            Continue to Payment
        </a>

        <a href="{% url 'plans' %}" class="back">
            ← Back to Plans
        </a>

    </div>

</body>
</html>
